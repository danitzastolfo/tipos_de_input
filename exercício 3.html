<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>exercício 02</title>
    </head>
    <body>
        <main>
        <form action="#" method="get">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Nome" required><br>

            <label for="sobrenome">Sobrenome:</label>
            <input type="text" id="sobrenome" name="sobrenome" placeholder="Sobrenome" required><br>

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="seu@e-mail.com" required><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required><br>

            <label for="pessoas">Número de pessoas:</label>
            <input type="number" id="pessoas" name="pessoas" required><br>

            <label for="data">Data da reserva:</label>
            <input type="date" id="data" name="data" required><br>

            <label for="horario">Horário da reserva:</label>
            <input type="time" id="horario" name="horario" required><br><br>

            <label for="preferencias">Preferências alimentares:</label><br>
            <label for="xx">XX</label>
            <input type="checkbox" id="xx" name="xx"><br>
            <label for="yy">YY</label>
            <input type="checkbox" id="yy" name="yy"><br><br>

            <label for="restricoes">Restrições alimentares:</label><br>
            <label for="ww">WW</label>
            <input type="checkbox" id="ww" name="ww"><br>
            <label for="zz">ZZ</label>
            <input type="checkbox" id="zz" name="zz"><br><br>

            <label for="comentarios">Comentários:</label><br>
            <textarea name="comentarios" id="comentarios" placeholder="Comente aqui..."></textarea><br>

            <label for="tipo">Tipo de evento:</label>
            <select name="tipo" id="tipo" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="gg">GG</option>
                <option value="tt">TT</option>
            </select><br><br>

            <label for="necessidades">Necessidades especiais:</label><br>
            <label for="rs">RS</label>
            <input type="checkbox" id="rs" name="rs"><br>
            <label for="direita">direita</label>
            <input type="checkbox" id="direita" name="direita"><br><br>

            <label for="assento">Preferência de assento:</label><br>
            <label for="aa">aa</label>
            <input type="checkbox" id="aa" name="aa"><br>
            <label for="bb">bb</label>
            <input type="checkbox" id="bb" name="bb"><br><br>

            <label for="codigo">Código promocional:</label>
            <input type="text" name="codigo" id="codigo"><br><br>

            <input type="checkbox" id="termcond" name="termcond">
            <label for="termcond">Eu li e aceito os Termos e Condições</label><br>

            <input type="checkbox" id="recebenoti" name="recebenoti">
            <label for="recebenoti">Quero receber notificações e atualizações sobre o serviço</label><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade" required><br>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required><br>

            <label for="pais">País:</label>
            <input type="text" id="pais" name="pais" required><br>

            <label for="referencia">Referência:</label>
            <input type="text" id="referencia" name="referencia" placeholder="Referência"><br>
            
            <br><button type="submit">ENVIAR</button>
        </form>
    </main>
    </body>
</html>
