<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>Formulário: Exemplo 01</title>
    </head>
    <body>
        <header>
            <h1 style="text-align: center;">Formulário de Cadastro</h1>
        </header>
        <main>
            <form action="#" method="get">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Seu nome aqui" required><br>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" placeholder="Sua idade aqui" required><br><br>
                <button type="submit">ENVIAR</button>
            </form>
        </main>
    </body>
</html>
