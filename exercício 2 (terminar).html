<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>exercício 02</title>
    </head>
    <body>
        <main>
        <form action="#" method="get">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Nome" required><br>

            <label for="nascimento">Data de nascimento:</label>
            <input type="date" id="nascimento" name="nascimento" required><br>

            <label>Gênero:</label><br><br>
            <label for="femi">Feminino</label>
            <input type="radio" id="femi" value="femi" name="gênero" required><br>
            <label for="masc">Masculino</label>
            <input type="radio" id="masc" value="masc" name="gênero" required><br>
            <label for="outro">Outro</label>
            <input type="radio" id="outro" value="outro" name="gênero" required><br><br>

            <label for="e-mail">E-mail:</label>
            <input type="email" id="e-mail" name="e-mail" placeholder="seu@e-mail.com" required><br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" placeholder="(11) 11111-1111" required><br>

            <label for="endereço">Endereço:</label>
            <input type="text" id="endereço" name="endereço" placeholder="Bairro"><br>

            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade" placeholder="Cidade" required><br>

            <label for="estado">Estado:</label>
            <select name="estado" id="estado" required>
                <option value="" selected disabled>Selecione...</option>
                <option value="SP">SP</option>
                <option value="MG">MG</option>
                <option value="SC">SC</option>
                <option value="RJ">RJ</option>
            </select><br><br>

            <label for="cep">CEP:</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required><br>

            <label for="usuario">Nome de Usuário:</label>
            <input type="text" id="usuario" name="usuario" placeholder="nome.de_usuário123" required><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" required><br>

            <label for="confsenha">Confirmação de Senha:</label>
            <input type="password" id="confsenha" name="confsenha" required><br>

            <label for="foto">Foto de Perfil</label>
            <input type="file" id="foto" name="foto"><br><br>

            <label>Hobbies:</label><br>
            <input type="checkbox" id="leitura" name="hobbies">
            <label for="leitura">Leitura</label><br>
            <input type="checkbox" id="pintura" name="hobbies">
            <label for="pintura">Pintura</label><br>
            <input type="checkbox" id="escrita" name="hobbies">
            <label for="escrita">Escrita</label><br>
            <input type="checkbox" id="exercicio" name="hobbies">
            <label for="exercicio">Exercício físico</label><br>
            <input type="checkbox" id="outro" name="hobbies">
            <label for="outro">Outro(s)</label><br><br>

            <label for="educacao">Nível de Educação:</label>
            <select name="educacao" id="educacao" required>
                <option value="selecione" selected disabled>Selecione...</option>
                <option value="fundin">Fundamental incompleto</option>
                <option value="fundco">Fundamental completo</option>
                <option value="emco">Ensino Médio completo</option>
                <option value="emin">Ensino Médio incompleto</option>
            </select><br>

            <label for="profissao">Profissão:</label>
            <input type="text" id="profissao" name="profissao" placeholder="Sua profissão"><br>

            <label for="biografia">Biografia:</label><br>
            <textarea id="biografia" name="biografia" placeholder="Nos diga um pouco sobre você..."></textarea><br><br>

            <input type="checkbox" id="termcond" name="termcond" required>
            <label for="termcond">Eu li e aceito os Termos e Condições</label><br>

            <input type="checkbox" id="recebenoti" name="recebenoti">
            <label for="recebenoti">Quero receber notificações e atualizações sobre o serviço</label><br><br>
            
            <button type="submit">ENVIAR</button>
        </form>
    </main>
    </body>
</html>
